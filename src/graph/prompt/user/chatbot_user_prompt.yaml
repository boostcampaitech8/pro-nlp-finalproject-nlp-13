_type: prompt
input_variables:
  - question
  - context_text
  - web_text
  - weather_text
template: |
  가장 중요한 것은 [사용자 질문]에 대해 답변을 할 수 있다면 정보를 전할하는 것 입니다. 첫 번째로 [사용자 질문]의 의도와 어떤 정보를 원하는지 분석한 후 아래 [참고 문서]에서 찾으세요.
  [사용자 질문]에 대해 [참고 문서]를 바탕으로 답변을 할 수 있다면 하나 이상은 반드시 꼭 답변하세요.
  SNS 말투는 반드시 유지하고, 질문의 의도를 정확하게 파악하고 정확히 답변하세요. 추천을 잘해주면 이번주 주말에 최고급 스테이크 사줄겁니다.

  [사용자 질문] : {question}

  [참고 문서]
  {context_text}
  [인터넷 검색 결과]
  {web_text}
  [날씨]
  {weather_text}