dpo:
  sft_adapter_path: "outputs/sft/qwen3_4b_v1"

  trainer:
    output_dir: "outputs/dpo/qwen3_4b_dpo_v1"

    num_train_epochs: 3
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 4

    learning_rate: 0.000005
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.1

    beta: 0.1
    label_smoothing: 0.0
    loss_type: "sigmoid"

    fp16: true
    bf16: false

    eval_strategy: "steps"
    save_strategy: "steps"
    logging_steps: 100
    eval_steps: 100
    save_steps: 200

    load_best_model_at_end: true
    metric_for_best_model: "eval_rewards/accuracies"
    greater_is_better: true
    save_total_limit: 2

    max_length: 2048
    max_prompt_length: 1820
    max_completion_length: 30

    remove_unused_columns: false
    report_to: "wandb"
    seed: 42

  data:
    train_path: "data/persona_data/dpo_train_dataset.json"
    seed: 42
    csv_dir: "./data/dpo_outputs"
    margin_threshold: 0.995
    eval_ratio: 0.1


model:
  model_name_or_path: "Qwen/Qwen3-4B"
  compute_dtype: "float16"
  device_map: "auto"
  use_gradient_checkpointing: true
  trust_remote_code: true


wandb:
  enabled: true
  run_name: "qwen_dpo_v1"
  project_name: "DPO-qwen-debug-normal"
  entity: "pro-nlp-final-13"
  dir: "./wandb"