dpo:
  sft_adapter_path: "src/models/checkpoint-16239"

  trainer:
    output_dir: "src/models/exaone_dpo"

    num_train_epochs: 10
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 4

    learning_rate: 0.000005
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.1

    beta: 0.1
    label_smoothing: 0.0
    loss_type: "sigmoid"

    fp16: true
    bf16: false

    eval_strategy: "steps"
    save_strategy: "steps"
    logging_steps: 20
    eval_steps: 20
    save_steps: 60

    load_best_model_at_end: true
    metric_for_best_model: "eval_rewards/accuracies"
    greater_is_better: true
    save_total_limit: 2

    max_length: 2048
    max_prompt_length: 1820
    max_completion_length: 30

    remove_unused_columns: false
    report_to: "wandb"
    seed: 42

  data:
    train_path: "data/persona_data/AiHub_dpo_dataset.json"
    eval_path: "./data/dpo_eval.jsonl"
    seed: 42
    csv_dir: "./data/dpo_outputs"
    margin_threshold: 0.995
    eval_ratio: 0.1


model:
  model_name_or_path: "LGAI-EXAONE/EXAONE-4.0-1.2B"
  compute_dtype: "float16"
  device_map: "auto"
  use_gradient_checkpointing: true
  trust_remote_code: true


wandb:
  enabled: true
  run_name: "exaone_dpo_normal"
  project_name: "DPO-exaone-normal"
  entity: "pro-nlp-final-13"
  dir: "./wandb"